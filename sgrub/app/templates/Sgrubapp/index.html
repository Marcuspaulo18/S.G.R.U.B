{%load static%}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGRUB Análise de Resíduos</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <link rel="stylesheet" href="{% static 'css/style.css'%}?v=1.1">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

  <div class="app-index">

    <div class="section-index">
        <section>

            <div>

            </div> -->

            </div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script>

    $('#btnlogin').on('click', function () {
      window.location.href = '/app/login.html';
    });
    $('#btncadastro').on('click', function () {
      window.location.href = '/app/cadastro.html';
    });
    $('#btnhistorico').on('click', function () {
      window.location.href = '/app/historico.html';
    });
    $('#btnrelatorio').on('click', function () {
