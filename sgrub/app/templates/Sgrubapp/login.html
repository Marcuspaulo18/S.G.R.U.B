{%load static%}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGRUB Análise de Resíduos</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <link rel="stylesheet" href="{% static 'css/style.css'%}?v=1.4">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  
 <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-login">

 <div class="app-header d-grid align-items-center py-3" style="grid-template-columns: 1fr auto 1fr;">
    <div></div>
    <div class="text-center">
      <h1 class="m-0">SGRUB</h1>
      <div class="subtitulo">Sistema de Gestão de Resíduos</div>
    </div>
    <div class="pe-3 text-end">
      <a href="/app/" class="btn btn-outline-light d-inline-flex align-items-center gap-2" id="botaovoltarbtn">
        <i class="bi bi-arrow-left"></i> voltar
      </a>
    </div>
  </div>
    <!-- ===================== TELA 1: LOGIN ===================== -->
    <div id="screen-login" class="screen active">

      <div class="section-login">
        <div class="login-card">
          <h2 class="login-titulo">Entrar</h2>
          <p class="login-subtitulo">Acesse sua conta para continuar</p>

          <form id="form-login" class="login-form" onsubmit="return false;">
            <div class="login-campo">
              <label class="campo-label" for="login-email">E-mail</label>
              <input class="campo-empresa" type="email" id="login-email" placeholder="seu@email.com" required />
            </div>

            <div class="login-campo">
              <label class="campo-label" for="login-senha">Senha</label>
              <input class="campo-empresa" type="password" id="login-senha" placeholder="Digite sua senha" required />
            </div>

            <div id="login-erro" class="login-erro" style="display:none;">
              E-mail ou senha incorretos.
            </div>

            <button class="btn-login" type="submit" id="btn-entrar">Entrar</button>
          </form>

          <div class="login-links">
            <a href="/app/cadastro.html" class="login-link">Criar conta</a>
          </div>

          <button class="btn-voltar-login" type="button" id="btn-voltar">
            Voltar
          </button>
        </div>
      </div>

    </div>

  </div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script>
    $('#btn-entrar').on('click', function () {
      var email = $('#login-email').val().trim();
      var senha = $('#login-senha').val().trim();

      const dados = new FormData();
      dados.append('email', email);
      dados.append('senha',senha)

       $.ajax({
        url: '/api/login/',
        type: 'POST',
        data: dados,
        processData: false,
        contentType: false,
        success: function (response) {
           window.location.href = '/app/';
           console.log(1)
        },
        error: function (xhr) {
          alert("erro!")
        }
      });

     
    });

    $('#btn-voltar').on('click', function () {
      window.location.href = '/app/';
    });
  </script>

</body>
</html>
